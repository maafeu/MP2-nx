# XDK 5558 library data layouts the runtime reads or writes. Each value is proven by Max Payne 2's default.xbe
# (TT-012, all libraries 5558) at the address given. Every field checked holds the same offset as in 5849
# (xdk/5849/layout.toml); MP2-nx docs/MP2-notes.md, "XDK 5558".
[layout]
# D3D8 CDevice, the static device D3D__pDevice (0x29AD48) points at
CDevice_Push          = 0x0     # D3DDevice_SetPalette 0x28AA23 reads it, 0x28AA25 compares with +4, calls MakeSpace 0x28F910
CDevice_PushThreshold = 0x4     # D3DDevice_SetPalette 0x28AA1E loads the threshold
CDevice_BaseVertex    = 0x1C    # as 5849; MP2 never calls D3DDevice_SetIndices (it passes index pointers to DrawIndexedVertices)
CDevice_IndexBuffer   = 0x7A0   # the device teardown 0x291E8A reads it
CDevice_ZScale        = 0x948   # D3DDevice_SetRenderTarget and GetViewportOffsetAndScale 0x28D170 read +0x948
CDevice_SuperSampleX  = 0x95C   # GetViewportOffsetAndScale 0x28D170
CDevice_SuperSampleY  = 0x960   # GetViewportOffsetAndScale 0x28D170
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform 0x2897D0 copies to +0xC60 + type * 64
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture 0x28A820 reads, 0x28A859 stores [stage]
CDevice_Palettes      = 0xF98   # D3DDevice_SetPalette 0x28A9CD reads, 0x28AA05 stores [stage]
CDevice_RenderTarget  = 0x1A04  # D3DDevice_GetRenderTarget2 0x28A180 returns it
CDevice_Depth         = 0x1A08  # D3DDevice_GetDepthStencilSurface2 0x28A1A6 returns it
CDevice_BackBuffer    = 0x1A14  # D3DDevice_GetBackBuffer2 0x289E30 returns it for index 0
CDevice_FrontBuffer   = 0x1A18  # D3DDevice_GetBackBuffer2 0x289E15 returns it for index -1
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap 0x290510 increments it, 0x29058B returns it
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice 0x28EC4B clears 0x928 dwords
CDevice_Flags             = 0x8    # as 5849 (D3DDevice_SetPixelShader 0x28CBE0 tests the behaviour flags)
CDevice_Time              = 0x2C   # D3DDevice_IsFencePending 0x28F438 reads the time, +0x30 the GPU's
CDevice_PixelShader       = 0x784  # D3DDevice_SetPixelShader 0x28CBF8 stores the handle
CDevice_VertexShader      = 0x794  # D3DDevice_SetVertexShader 0x28C2C1 reads, 0x28C33E stores it
CDevice_BackBufferScale   = 0x96C  # the frame buffer init 0x29146B stores the X scale, +0x970 Y; 0x2905E1 reads both
CDevice_Viewport          = 0xEE0  # D3DDevice_SetViewport / GetViewportOffsetAndScale 0x28D170 (+0xEE0 to +0xEF4)
CDevice_ScreenSpaceOffset = 0xEF8  # GetViewportOffsetAndScale 0x28D170 reads +0xEF8
CDevice_AutoDepth         = 0x1A20 # D3D_InitDefaultState 0x2911F7 reads it, 0x29132E stores it
CDevice_VBlankCallback    = 0x1DB8 # as 5849: the miniport is at +0x1C28 (0x28FB39), the vertical blank state beside it
CDevice_VBlankEvent       = 0x1DBC # D3DDevice_BlockUntilVerticalBlank 0x289970 (constants 0x1DBC, 0x1DC0)
CDevice_DisplayFlags      = 0x1DDC # the vertical blank handler 0x28FB5B tests +0x1DDC
CDevice_VBlankCount       = 0x1DE8 # the vertical blank handler 0x28FBD7 reads, 0x28FBEB stores it
CDevice_Field             = 0x1DF8 # as 5849, beside VBlankCount in the miniport block
CDevice_GammaRamps        = 0x1E04 # D3DDevice_SetGammaRamp 0x289740: miniport (+0x1C28) + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2404 # D3DDevice_SetGammaRamp 0x289740: miniport + 0x7DC + index * 4
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x28A897 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x28DB6B: stage << 5, [stage * 32 + type] dwords at 0x29A8B0
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x28BE5A: n * 3 dwords from D3D__Streams 0x299998
Stream_Stride         = 0x0     # as 5849
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x28BE90 reads, 0x28BEA2 stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_CreatePixelShader 0x28CB54 stores the definition pointer, SetPixelShader 0x28CC60 reads it
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # as 5849; MP2 links no DirectSound streams
CDirectSoundStream_Vtable2 = 0x4  # as 5849
EffectsImage_Skip0    = 0x804   # 0x2DC947 adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x2DC941 loads this dword count
EffectsImage_Desc     = 0x818   # 0x2DC950: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # as 5849
XPP_Changed           = 0x4     # as 5849
XPP_Previous          = 0x8     # as 5849
