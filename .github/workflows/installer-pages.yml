# The web installer (installer/) on GitHub Pages: https://maafeu.github.io/MP2-nx/
# Publishes the folder as it is (a static page: no build step) whenever it changes on main, or by hand.
name: Web installer

on:
  push:
    branches: [main]
    paths: ['installer/**', '.github/workflows/installer-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: installer
      - id: deployment
        uses: actions/deploy-pages@v4
